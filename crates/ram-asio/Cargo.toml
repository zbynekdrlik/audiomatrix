[package]
name = "ram-asio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ASIO device support for AudioMatrix - Windows ASIO driver integration"

[features]
# ASIO is ALWAYS enabled on Windows - it is a CORE feature, not optional
# Requires: Steinberg ASIO SDK, LLVM/Clang - Windows only
default = ["asio"]
asio = ["cpal/asio"]

[dependencies]
# Audio - cpal with ASIO (enabled by default on Windows)
cpal = { workspace = true }

# Core types
ram-core = { path = "../ram-core" }

# Async
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows-specific dependencies for ASIO and virtual device shared memory
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Memory",
] }

[dev-dependencies]
proptest = { workspace = true }
