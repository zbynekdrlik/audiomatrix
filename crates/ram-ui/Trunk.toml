# Trunk configuration for building WASM bundle
# https://trunkrs.dev/configuration/

[build]
# Target directory for build output
target = "../../target/trunk"
# Release build for production
release = false

[watch]
# Watch these paths for changes
watch = ["src", "index.html", "style.css"]
# Ignore these paths
ignore = ["target"]

[serve]
# Development server port
port = 8081
# Proxy API requests to the AudioMatrix service
[[serve.proxy]]
rewrite = "/api/"
backend = "http://localhost:8080/api/"

[[serve.proxy]]
rewrite = "/ws"
backend = "ws://localhost:8080/api/v1/ws"

[clean]
# Clean the target directory on trunk clean
dist = true
cargo = false
