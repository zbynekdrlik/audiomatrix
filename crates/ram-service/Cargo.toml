[package]
name = "ram-service"
description = "AudioMatrix service binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "audiomatrix"
path = "src/main.rs"

[features]
default = []

[dependencies]
ram-core = { path = "../ram-core" }
ram-vban = { path = "../ram-vban" }
ram-discovery = { path = "../ram-discovery" }
ram-api = { path = "../ram-api" }
axum.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
hostname.workspace = true
crossbeam-channel.workspace = true
cpal.workspace = true
uuid.workspace = true

# Windows: ASIO is a CORE feature - NOT optional
# Windows: System tray and GUI dependencies
[target.'cfg(windows)'.dependencies]
ram-asio = { path = "../ram-asio" }
tray-icon.workspace = true
muda.workspace = true
image.workspace = true
winit.workspace = true
winrt-notification.workspace = true
windows.workspace = true
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest = { workspace = true }
ram-api = { path = "../ram-api" }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
urlencoding = { workspace = true }
bytes = { workspace = true }
tempfile = "3.14"
