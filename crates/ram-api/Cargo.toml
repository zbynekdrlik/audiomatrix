[package]
name = "ram-api"
description = "REST and WebSocket API for AudioMatrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Always required (for shared types)
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

# Server-only dependencies
ram-core = { path = "../ram-core", optional = true }
ram-discovery = { path = "../ram-discovery", optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
default = ["server"]
server = ["axum", "tower", "tower-http", "tokio", "ram-core", "ram-discovery", "hostname", "parking_lot", "futures-util", "rand", "base64", "tracing"]
client = []  # Only models, for WASM clients

[dev-dependencies]
