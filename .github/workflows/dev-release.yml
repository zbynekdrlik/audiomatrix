name: Dev Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # Get version info
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  # Build WASM UI first (needed for embedding in service)
  build-ui:
    name: Build WASM UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: cargo install trunk

      - name: Build WASM UI
        working-directory: crates/ram-ui
        run: trunk build --release

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/
          retention-days: 1

  # Build binaries (Windows only - macOS and Linux disabled to reduce costs)
  build:
    name: Build (${{ matrix.target }})
    needs: [version, build-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: Linux and macOS builds disabled to reduce CI costs
          # Re-enable when needed:
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   name: linux-x64
          #   ext: ""
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   name: macos-x64
          #   ext: ""
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   name: macos-arm64
          #   ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Install LLVM/Clang for ASIO SDK (Windows only)
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # Clone ASIO SDK from GitHub (now GPLv3 licensed)
      - name: Clone ASIO SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/audiosdk/asio.git $env:RUNNER_TEMP\asio_sdk
          echo "CPAL_ASIO_DIR=$env:RUNNER_TEMP\asio_sdk" >> $env:GITHUB_ENV
          Write-Host "ASIO SDK cloned to $env:RUNNER_TEMP\asio_sdk"

      # Build with ASIO on Windows, standard build on other platforms
      - name: Build release binary (Windows with ASIO)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p ram-service --features asio

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }} -p ram-service

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/audiomatrix dist/audiomatrix-dev-${{ matrix.name }}
          chmod +x dist/audiomatrix-dev-${{ matrix.name }}

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/audiomatrix.exe" "dist/audiomatrix-dev-${{ matrix.name }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiomatrix-dev-${{ matrix.name }}
          path: dist/audiomatrix-dev-*
          retention-days: 7

  # Create/Update dev pre-release
  release:
    name: Update Dev Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: audiomatrix-dev-*

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name 'audiomatrix-dev-*' -type f -exec cp {} release/ \;

          # Generate checksums
          cd release
          sha256sum * > SHA256SUMS.txt

          echo "Release files:"
          ls -la

      - name: Generate dev install script
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cat > release/install-dev.ps1 << 'DEVINSTALLER'
          #Requires -Version 5.1
          <#
          .SYNOPSIS
              AudioMatrix Dev Build Installer
          .DESCRIPTION
              Downloads and installs the latest AudioMatrix dev build
          .EXAMPLE
              irm https://github.com/zbynekdrlik/audiomatrix/releases/download/dev/install-dev.ps1 | iex
          #>
          param(
              [string]$InstallDir = "$env:LOCALAPPDATA\AudioMatrix",
              [switch]$NoPath
          )

          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $Version = "__VERSION__"
          $Repo = "zbynekdrlik/audiomatrix"
          $Asset = "audiomatrix-dev-windows-x64.exe"

          Write-Host ""
          Write-Host "======================================================" -ForegroundColor Magenta
          Write-Host "  AudioMatrix DEV Installer" -ForegroundColor Magenta
          Write-Host "  Version: $Version" -ForegroundColor Magenta
          Write-Host "  WARNING: Development build - may be unstable" -ForegroundColor Yellow
          Write-Host "======================================================" -ForegroundColor Magenta
          Write-Host ""

          Write-Host "[1/4] Creating install directory..." -ForegroundColor Yellow
          if (-not (Test-Path $InstallDir)) {
              New-Item -ItemType Directory -Path $InstallDir -Force | Out-Null
          }
          Write-Host "      Location: $InstallDir" -ForegroundColor Gray

          Write-Host "[2/4] Downloading AudioMatrix dev build..." -ForegroundColor Yellow
          $DownloadUrl = "https://github.com/$Repo/releases/download/dev/$Asset"
          $ExePath = Join-Path $InstallDir "audiomatrix.exe"

          try {
              Invoke-WebRequest -Uri $DownloadUrl -OutFile $ExePath -UseBasicParsing
          } catch {
              Write-Host "      ERROR: Download failed" -ForegroundColor Red
              Write-Host "      URL: $DownloadUrl" -ForegroundColor Gray
              Write-Host "      $_" -ForegroundColor Red
              exit 1
          }
          Write-Host "      OK: Downloaded successfully" -ForegroundColor Green

          Write-Host "[3/4] Verifying installation..." -ForegroundColor Yellow
          if (-not (Test-Path $ExePath)) {
              Write-Host "      ERROR: Binary not found" -ForegroundColor Red
              exit 1
          }
          $FileSize = [math]::Round((Get-Item $ExePath).Length / 1MB, 2)
          Write-Host "      Size: $FileSize MB" -ForegroundColor Gray
          Write-Host "      OK: Verification passed" -ForegroundColor Green

          Write-Host "[4/4] Configuring PATH..." -ForegroundColor Yellow
          if (-not $NoPath) {
              $UserPath = [Environment]::GetEnvironmentVariable("Path", "User")
              if ($UserPath -notlike "*$InstallDir*") {
                  [Environment]::SetEnvironmentVariable("Path", "$UserPath;$InstallDir", "User")
                  Write-Host "      OK: Added to PATH" -ForegroundColor Green
                  Write-Host "      Note: Restart terminal to use 'audiomatrix' command" -ForegroundColor Gray
              } else {
                  Write-Host "      Already in PATH" -ForegroundColor Gray
              }
          } else {
              Write-Host "      Skipped (--NoPath)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "======================================================" -ForegroundColor Green
          Write-Host "  Dev Build Installation Complete!" -ForegroundColor Green
          Write-Host "======================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "  Version:  $Version (dev)" -ForegroundColor White
          Write-Host "  Location: $ExePath" -ForegroundColor White
          Write-Host ""
          Write-Host "  Usage: audiomatrix --help" -ForegroundColor Cyan
          Write-Host ""
          DEVINSTALLER

          # Replace version placeholder
          sed -i "s/__VERSION__/$VERSION/g" release/install-dev.ps1

      - name: Delete existing dev release
        run: |
          gh release delete dev --yes || true
          git push origin :refs/tags/dev || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Development Build (${{ needs.version.outputs.version }})"
          prerelease: true
          body: |
            ## AudioMatrix Development Build

            **Version:** ${{ needs.version.outputs.version }}
            **Branch:** develop
            **Commit:** ${{ github.sha }}

            ⚠️ **WARNING:** This is a development build and may be unstable.

            ### Quick Install (Windows PowerShell)

            ```powershell
            irm https://github.com/zbynekdrlik/audiomatrix/releases/download/dev/install-dev.ps1 | iex
            ```

            ### Manual Download

            - **Windows:** `audiomatrix-dev-windows-x64.exe`

            > Note: Linux and macOS builds are temporarily disabled to reduce CI costs.

            ### Checksums

            See `SHA256SUMS.txt` for file verification.

            ---
            For stable releases, see the [Releases page](https://github.com/zbynekdrlik/audiomatrix/releases).
          files: |
            release/*
