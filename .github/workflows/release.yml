name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Only release tags (no -dev)

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # Validate tag matches Cargo.toml version
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract and validate version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi

          if [[ "$CARGO_VERSION" =~ -dev ]]; then
            echo "::error::Cannot release dev version: $CARGO_VERSION"
            exit 1
          fi

          echo "version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "✓ Valid release version: $CARGO_VERSION"

  # Build binaries (Windows only - macOS and Linux disabled to reduce costs)
  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: Linux and macOS builds disabled to reduce CI costs
          # Re-enable when needed:
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   name: linux-x64
          #   ext: ""
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   name: macos-x64
          #   ext: ""
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   name: macos-arm64
          #   ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p ram-service

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/audiomatrix dist/audiomatrix
          chmod +x dist/audiomatrix
          cd dist
          tar -czvf audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.tar.gz audiomatrix
          sha256sum audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.tar.gz > audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.tar.gz.sha256

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/audiomatrix.exe" "dist/audiomatrix.exe"
          # Create both zip and standalone exe
          Compress-Archive -Path "dist/audiomatrix.exe" -DestinationPath "dist/audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.zip"
          Copy-Item "dist/audiomatrix.exe" "dist/audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.exe"
          # Generate checksums
          $zipHash = (Get-FileHash "dist/audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash "dist/audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.exe" -Algorithm SHA256).Hash.ToLower()
          "$zipHash  audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.zip" | Out-File -Encoding ASCII "dist/audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.zip.sha256"
          "$exeHash  audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.exe" | Out-File -Encoding ASCII "dist/audiomatrix-${{ needs.validate.outputs.version }}-${{ matrix.name }}.exe.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audiomatrix-${{ matrix.name }}
          path: dist/audiomatrix-*

  # Create GitHub Release with IRM installer
  release:
    name: Create Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release/ \;

          # Create combined SHA256SUMS
          cd release
          cat ../artifacts/*/audiomatrix-*.sha256 > SHA256SUMS.txt
          echo "Release files:"
          ls -la

      - name: Generate IRM installer script
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cat > release/install.ps1 << 'INSTALLER_SCRIPT'
          #Requires -Version 5.1
          <#
          .SYNOPSIS
              AudioMatrix Windows Installer
          .DESCRIPTION
              Downloads and installs AudioMatrix audio routing system
          .PARAMETER InstallDir
              Installation directory (default: $env:LOCALAPPDATA\AudioMatrix)
          .PARAMETER NoPath
              Skip adding to PATH
          .EXAMPLE
              irm https://github.com/zbynekdrlik/audiomatrix/releases/latest/download/install.ps1 | iex
          #>
          param(
              [string]$InstallDir = "$env:LOCALAPPDATA\AudioMatrix",
              [switch]$NoPath
          )

          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $Version = "__VERSION__"
          $Repo = "zbynekdrlik/audiomatrix"
          $Asset = "audiomatrix-$Version-windows-x64.exe"

          Write-Host ""
          Write-Host "======================================================" -ForegroundColor Cyan
          Write-Host "  AudioMatrix Installer v$Version" -ForegroundColor Cyan
          Write-Host "  Professional Audio Routing System" -ForegroundColor Cyan
          Write-Host "======================================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "[1/4] Creating install directory..." -ForegroundColor Yellow
          if (-not (Test-Path $InstallDir)) {
              New-Item -ItemType Directory -Path $InstallDir -Force | Out-Null
          }
          Write-Host "      Location: $InstallDir" -ForegroundColor Gray

          Write-Host "[2/4] Downloading AudioMatrix v$Version..." -ForegroundColor Yellow
          $DownloadUrl = "https://github.com/$Repo/releases/download/v$Version/$Asset"
          $ExePath = Join-Path $InstallDir "audiomatrix.exe"

          try {
              Invoke-WebRequest -Uri $DownloadUrl -OutFile $ExePath -UseBasicParsing
          } catch {
              Write-Host "      ERROR: Download failed" -ForegroundColor Red
              Write-Host "      URL: $DownloadUrl" -ForegroundColor Gray
              Write-Host "      $_" -ForegroundColor Red
              exit 1
          }
          Write-Host "      OK: Downloaded successfully" -ForegroundColor Green

          Write-Host "[3/4] Verifying installation..." -ForegroundColor Yellow
          if (-not (Test-Path $ExePath)) {
              Write-Host "      ERROR: Binary not found" -ForegroundColor Red
              exit 1
          }
          $FileSize = [math]::Round((Get-Item $ExePath).Length / 1MB, 2)
          Write-Host "      Size: $FileSize MB" -ForegroundColor Gray
          Write-Host "      OK: Verification passed" -ForegroundColor Green

          Write-Host "[4/4] Configuring PATH..." -ForegroundColor Yellow
          if (-not $NoPath) {
              $UserPath = [Environment]::GetEnvironmentVariable("Path", "User")
              if ($UserPath -notlike "*$InstallDir*") {
                  [Environment]::SetEnvironmentVariable("Path", "$UserPath;$InstallDir", "User")
                  Write-Host "      OK: Added to PATH" -ForegroundColor Green
                  Write-Host "      Note: Restart terminal to use 'audiomatrix' command" -ForegroundColor Gray
              } else {
                  Write-Host "      Already in PATH" -ForegroundColor Gray
              }
          } else {
              Write-Host "      Skipped (--NoPath)" -ForegroundColor Gray
          }

          Write-Host ""
          Write-Host "======================================================" -ForegroundColor Green
          Write-Host "  Installation Complete!" -ForegroundColor Green
          Write-Host "======================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "  Version:  v$Version" -ForegroundColor White
          Write-Host "  Location: $ExePath" -ForegroundColor White
          Write-Host ""
          Write-Host "  Usage: audiomatrix --help" -ForegroundColor Cyan
          Write-Host ""
          INSTALLER_SCRIPT

          # Replace version placeholder
          sed -i "s/__VERSION__/$VERSION/g" release/install.ps1

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" HEAD~10..HEAD)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AudioMatrix v${{ needs.validate.outputs.version }}
          body: |
            ## AudioMatrix v${{ needs.validate.outputs.version }}

            Professional audio routing system for Windows.

            > Note: Linux and macOS builds are temporarily disabled.

            ### Quick Install (Windows PowerShell)

            ```powershell
            irm https://github.com/zbynekdrlik/audiomatrix/releases/download/v${{ needs.validate.outputs.version }}/install.ps1 | iex
            ```

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### Checksums
            See `SHA256SUMS.txt` for file verification.
          files: |
            release/*
          draft: false
          prerelease: false
