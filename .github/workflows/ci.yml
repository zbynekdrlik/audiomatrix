name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  # Version format validation - enforce dev/release versioning
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate version format
        run: |
          VERSION=$(grep -m1 'version = ' Cargo.toml | cut -d'"' -f2)
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Version: $VERSION, Branch: $BRANCH"

          if [[ "$BRANCH" == "develop" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
              echo "::error::Develop branch must have -dev.N version format, got: $VERSION"
              echo "::error::Expected format: X.Y.Z-dev.N (e.g., 0.1.0-dev.1)"
              exit 1
            fi
            echo "✓ Valid dev version: $VERSION"
          elif [[ "$BRANCH" == "main" ]]; then
            if [[ "$VERSION" =~ -dev ]]; then
              echo "::error::Main branch cannot have dev version, got: $VERSION"
              echo "::error::Expected format: X.Y.Z (e.g., 0.1.0)"
              exit 1
            fi
            echo "✓ Valid release version: $VERSION"
          else
            echo "ℹ Skipping version check for branch: $BRANCH"
          fi

  # Fast format check - fail early
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy lints with pedantic mode
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Don't use --all-features as 'asio' feature is Windows-only
      - run: cargo clippy --all-targets --workspace -- -D warnings -D clippy::pedantic -A clippy::module_name_repetitions

  # Tests on all platforms
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Run tests - exclude ASIO on Windows (separate job handles that)
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --all-features --workspace
      - name: Run tests (Windows - no ASIO)
        if: runner.os == 'Windows'
        run: cargo test --workspace
      - name: Run doc tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --doc --all-features
      - name: Run doc tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --doc

  # Windows ASIO build verification
  test-windows-asio:
    name: Test Windows ASIO
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-asio

      # Install LLVM/Clang (required for ASIO SDK compilation)
      - name: Install LLVM
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # Clone ASIO SDK from GitHub (now GPLv3 licensed)
      - name: Clone ASIO SDK
        run: |
          git clone https://github.com/audiosdk/asio.git $env:RUNNER_TEMP\asio_sdk
          echo "CPAL_ASIO_DIR=$env:RUNNER_TEMP\asio_sdk" >> $env:GITHUB_ENV
          Write-Host "ASIO SDK cloned to $env:RUNNER_TEMP\asio_sdk"

      # Build with ASIO feature
      - name: Build with ASIO feature
        run: cargo build --release -p ram-asio --features asio

      # Run unit tests (no device tests - those need real ASIO hardware)
      - name: Run ASIO unit tests
        run: cargo test -p ram-asio --features asio

  # Build and test Virtual ASIO C++ driver
  build-virtual-asio:
    name: Build & Test Virtual ASIO Driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Setup MSVC
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Configure and build with CMake
      # Note: No SDK needed - we have all ASIO definitions in virtual_asio.h
      - name: Configure CMake
        run: cmake -B build -S crates/ram-asio/cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build Virtual ASIO driver and test
        run: cmake --build build --config Release

      # Run E2E test for ASIO driver
      - name: Run ASIO driver E2E test
        run: |
          cd build
          ctest -C Release --output-on-failure --verbose

      # Upload driver artifact
      - name: Upload Virtual ASIO driver
        uses: actions/upload-artifact@v4
        with:
          name: audiomatrix-virtual-asio
          path: build/Release/AudioMatrixASIO.dll
          if-no-files-found: error

      # Upload test binaries
      - name: Upload ASIO test tools
        uses: actions/upload-artifact@v4
        with:
          name: audiomatrix-asio-test
          path: |
            build/Release/asio_test.exe
            build/Release/asio_com_test.exe
          if-no-files-found: error

  # Coverage enforcement
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Don't use --all-features as 'asio' feature is Windows-only
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true  # Strict: fail CI if coverage upload fails
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check coverage threshold
        run: |
          COVERAGE=$(cargo llvm-cov --workspace --json 2>/dev/null | jq -r '.data[0].totals.lines.percent // 0')
          echo "Coverage: $COVERAGE%"
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "null" ]; then
            echo "Warning: Could not determine coverage, skipping threshold check"
            exit 0
          fi
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Benchmark regression check (PRs only)
  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install critcmp
        run: cargo install critcmp
      - name: Run benchmarks (PR)
        run: cargo bench --workspace -- --save-baseline pr 2>/dev/null || echo "No benchmarks yet"
      - name: Checkout base branch
        run: git checkout ${{ github.base_ref }}
      - name: Run benchmarks (base)
        run: cargo bench --workspace -- --save-baseline base 2>/dev/null || echo "No benchmarks yet"
      - name: Compare benchmarks
        run: |
          critcmp base pr || echo "Benchmark comparison completed"
          # Future: Add threshold check for >10% regression

  # Miri for undefined behavior detection
  miri:
    name: Miri (UB Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Run Miri on ram-core
        run: cargo miri test -p ram-core 2>/dev/null || echo "ram-core not yet available"
        continue-on-error: true  # Until crate exists

  # Documentation build check
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # File size check
  file-size:
    name: File Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for oversized files
        run: |
          OVERSIZED=$(find . -name "*.rs" -type f ! -path "./target/*" -exec wc -l {} \; | awk '$1 > 1000 {print $2 ": " $1 " lines"}' || true)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Files exceeding 1000 lines:"
            echo "$OVERSIZED"
            exit 1
          fi
          echo "All Rust files are within size limits"

  # All checks must pass
  ci-complete:
    name: CI Complete
    needs: [version-check, fmt, clippy, test, coverage, audit, docs, file-size]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.version-check.result }}" != "success" ] || \
             [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.clippy.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ] || \
             [ "${{ needs.file-size.result }}" != "success" ]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "All checks passed!"
