name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  # Build WASM UI first (needed for ram-api compilation)
  build-ui:
    name: Build WASM UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: cargo install trunk

      - name: Build WASM UI
        working-directory: crates/ram-ui
        run: trunk build --release

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/
          retention-days: 1

  # Version format validation - enforce dev/release versioning
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate version format
        run: |
          VERSION=$(grep -m1 'version = ' Cargo.toml | cut -d'"' -f2)
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Version: $VERSION, Branch: $BRANCH"

          if [[ "$BRANCH" == "develop" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
              echo "::error::Develop branch must have -dev.N version format, got: $VERSION"
              echo "::error::Expected format: X.Y.Z-dev.N (e.g., 0.1.0-dev.1)"
              exit 1
            fi
            echo "✓ Valid dev version: $VERSION"
          elif [[ "$BRANCH" == "main" ]]; then
            if [[ "$VERSION" =~ -dev ]]; then
              echo "::error::Main branch cannot have dev version, got: $VERSION"
              echo "::error::Expected format: X.Y.Z (e.g., 0.1.0)"
              exit 1
            fi
            echo "✓ Valid release version: $VERSION"
          else
            echo "ℹ Skipping version check for branch: $BRANCH"
          fi

  # Fast format check - fail early
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy lints with pedantic mode
  clippy:
    name: Clippy Lints
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Don't use --all-features as 'asio' feature is Windows-only
      - run: cargo clippy --all-targets --workspace -- -D warnings -D clippy::pedantic -A clippy::module_name_repetitions

  # Tests on Windows only (macOS and Linux disabled to reduce CI costs)
  test:
    name: Test (${{ matrix.os }})
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        # NOTE: macOS and Linux builds disabled to reduce CI costs
        # Re-enable when needed: os: [ubuntu-latest, windows-latest, macos-latest]
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Run tests - exclude ASIO on Windows (separate job handles that)
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --all-features --workspace
      - name: Run tests (Windows - no ASIO, skip behavioral E2E)
        if: runner.os == 'Windows'
        # Exclude behavioral E2E tests - they run on stagebox1 with real ASIO
        run: "cargo test --workspace -- --skip behavior::"
      - name: Run doc tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --doc --all-features
      - name: Run doc tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --doc

  # Windows ASIO build verification
  test-windows-asio:
    name: Test Windows ASIO
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-asio

      # Install LLVM/Clang (required for ASIO SDK compilation)
      - name: Install LLVM
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # Clone ASIO SDK from GitHub (now GPLv3 licensed)
      - name: Clone ASIO SDK
        run: |
          git clone https://github.com/audiosdk/asio.git $env:RUNNER_TEMP\asio_sdk
          echo "CPAL_ASIO_DIR=$env:RUNNER_TEMP\asio_sdk" >> $env:GITHUB_ENV
          Write-Host "ASIO SDK cloned to $env:RUNNER_TEMP\asio_sdk"

      # Build with ASIO feature
      - name: Build with ASIO feature
        run: cargo build --release -p ram-asio --features asio

      # Run unit tests (no device tests - those need real ASIO hardware)
      - name: Run ASIO unit tests
        run: cargo test -p ram-asio --features asio

  # Build and test Virtual ASIO C++ driver
  build-virtual-asio:
    name: Build & Test Virtual ASIO Driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Setup MSVC
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Configure and build with CMake
      # Note: No SDK needed - we have all ASIO definitions in virtual_asio.h
      - name: Configure CMake
        run: cmake -B build -S crates/ram-asio/cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build Virtual ASIO driver and test
        run: cmake --build build --config Release

      # Run E2E test for ASIO driver
      - name: Run ASIO driver E2E test
        run: |
          cd build
          ctest -C Release --output-on-failure --verbose

      # Upload driver artifact
      - name: Upload Virtual ASIO driver
        uses: actions/upload-artifact@v4
        with:
          name: audiomatrix-virtual-asio
          path: build/Release/AudioMatrixASIO.dll
          if-no-files-found: error

      # Upload test binaries
      - name: Upload ASIO test tools
        uses: actions/upload-artifact@v4
        with:
          name: audiomatrix-asio-test
          path: |
            build/Release/asio_test.exe
            build/Release/asio_com_test.exe
            build/Release/asio_cocreate_test.exe
            build/Release/asio_vtable_test.exe
          if-no-files-found: error

  # Coverage enforcement
  coverage:
    name: Code Coverage
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Don't use --all-features as 'asio' feature is Windows-only
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true  # Strict: fail CI if coverage upload fails
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check coverage threshold
        run: |
          COVERAGE=$(cargo llvm-cov --workspace --json 2>/dev/null | jq -r '.data[0].totals.lines.percent // 0')
          echo "Coverage: $COVERAGE%"
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "null" ]; then
            echo "Warning: Could not determine coverage, skipping threshold check"
            exit 0
          fi
          # NOTE: Threshold temporarily lowered from 80% to 50% until more tests are added
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below 50% threshold"
            exit 1
          fi

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Benchmark regression check (PRs only)
  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install critcmp
        run: cargo install critcmp
      - name: Run benchmarks (PR)
        run: cargo bench --workspace -- --save-baseline pr 2>/dev/null || echo "No benchmarks yet"
      - name: Checkout base branch
        run: git checkout ${{ github.base_ref }}
      - name: Run benchmarks (base)
        run: cargo bench --workspace -- --save-baseline base 2>/dev/null || echo "No benchmarks yet"
      - name: Compare benchmarks
        run: |
          critcmp base pr || echo "Benchmark comparison completed"
          # Future: Add threshold check for >10% regression

  # Miri for undefined behavior detection
  miri:
    name: Miri (UB Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Run Miri on ram-core
        run: cargo miri test -p ram-core 2>/dev/null || echo "ram-core not yet available"
        continue-on-error: true  # Until crate exists

  # Documentation build check
  docs:
    name: Documentation
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # File size check
  file-size:
    name: File Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for oversized files
        run: |
          OVERSIZED=$(find . -name "*.rs" -type f ! -path "./target/*" -exec wc -l {} \; | awk '$1 > 1000 {print $2 ": " $1 " lines"}' || true)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Files exceeding 1000 lines:"
            echo "$OVERSIZED"
            exit 1
          fi
          echo "All Rust files are within size limits"

  # E2E Test Policy Enforcement - NO SKIPPING ALLOWED
  e2e-no-skip-check:
    name: E2E No-Skip Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for forbidden #[ignore] in E2E tests
        run: |
          echo "Checking E2E tests for forbidden #[ignore] attributes..."

          # Search for #[ignore in all E2E test files
          IGNORED=$(grep -rn '#\[ignore' crates/ram-service/tests/e2e/ 2>/dev/null || true)

          if [ -n "$IGNORED" ]; then
            echo "::error::FORBIDDEN: Found #[ignore] attributes in E2E tests!"
            echo "::error::E2E tests must NEVER be skipped. Fix the test infrastructure instead."
            echo ""
            echo "Violations found:"
            echo "$IGNORED"
            echo ""
            echo "POLICY: E2E tests run on stagebox1 self-hosted runner with real ASIO devices."
            echo "        If tests fail, fix the environment - DO NOT add #[ignore]."
            exit 1
          fi

          echo "✓ No #[ignore] attributes found in E2E tests - policy enforced!"

      - name: Check for graceful skip patterns
        run: |
          echo "Checking for forbidden skip patterns..."

          # Check for patterns that silently skip tests
          SKIPS=$(grep -rn 'println!.*skipping\|println!.*Skipping\|return;.*// skip\|eprintln!.*skipping' crates/ram-service/tests/e2e/ 2>/dev/null || true)

          if [ -n "$SKIPS" ]; then
            echo "::error::FORBIDDEN: Found graceful skip patterns in E2E tests!"
            echo "::error::Tests must FAIL loudly, not skip silently."
            echo ""
            echo "Violations found:"
            echo "$SKIPS"
            exit 1
          fi

          echo "✓ No graceful skip patterns found - tests will fail loudly if infrastructure missing!"

  # Build behavioral E2E test binaries on GitHub-hosted runner
  build-behavioral-tests:
    name: Build Behavioral Tests
    needs: build-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: behavioral-tests

      - name: Build test binary
        run: cargo test -p ram-service --test e2e_tests --no-run --message-format=json | Out-File -FilePath test-output.json
        shell: powershell

      - name: Find and copy test binary
        shell: powershell
        run: |
          $testBinary = Get-ChildItem -Path target/debug/deps -Filter "e2e_tests*.exe" | Where-Object { $_.Name -notmatch '\.d$' } | Select-Object -First 1
          if ($testBinary) {
            Copy-Item $testBinary.FullName -Destination "e2e_tests.exe"
            Write-Host "Found test binary: $($testBinary.Name)"
          } else {
            throw "Could not find test binary"
          }

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-test-binary
          path: e2e_tests.exe
          retention-days: 1

  # Run behavioral E2E tests on stagebox1 (real ASIO hardware)
  e2e-behavioral:
    name: E2E Behavioral (stagebox1)
    needs: build-behavioral-tests
    runs-on: [self-hosted, Windows, asio]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: behavioral-test-binary
          path: .

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - name: Run behavioral E2E tests
        run: |
          ./e2e_tests.exe behavior:: --test-threads=1
        env:
          TEST_SERVER_URL: "localhost:8080"
          CPAL_ASIO_DIR: "C:\\asio_sdk"

  # E2E Tests (Playwright)
  e2e:
    name: E2E Tests
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/ram-ui/dist/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build AudioMatrix
        run: cargo build --release -p ram-service

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start AudioMatrix server
        run: |
          ./target/release/audiomatrix -n ci-test &
          sleep 3
          curl -s http://localhost:8080/api/v1/health || echo "Server may need more time"
          sleep 2

      - name: Run E2E smoke tests
        working-directory: tests/e2e
        run: npx playwright test specs/smoke.spec.ts --reporter=list
        env:
          BASE_URL: http://localhost:8080

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/test-results/
          retention-days: 7

  # All checks must pass
  ci-complete:
    name: CI Complete
    needs: [build-ui, version-check, fmt, clippy, test, test-windows-asio, build-virtual-asio, coverage, audit, docs, file-size, e2e-no-skip-check, e2e-behavioral, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.build-ui.result }}" != "success" ] || \
             [ "${{ needs.version-check.result }}" != "success" ] || \
             [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.clippy.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.test-windows-asio.result }}" != "success" ] || \
             [ "${{ needs.build-virtual-asio.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ] || \
             [ "${{ needs.file-size.result }}" != "success" ] || \
             [ "${{ needs.e2e-no-skip-check.result }}" != "success" ] || \
             [ "${{ needs.e2e-behavioral.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "All checks passed!"
