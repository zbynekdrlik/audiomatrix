[workspace]
resolver = "2"
members = [
    "crates/ram-core",
    "crates/ram-vban",
    "crates/ram-discovery",
    "crates/ram-api",
    "crates/ram-asio",
    "crates/ram-service",
    "crates/ram-ui",
]

# ram-ui is built separately with Trunk for WASM target
exclude = []

[workspace.package]
version = "0.1.0-dev.31"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zbynekdrlik/audiomatrix"
authors = ["Zbynek Drlik <drlik.zbynek@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Audio
# Note: asio feature requires ASIO SDK. On Windows CI without SDK, builds still work
# but ASIO devices won't be enumerated. Users need ASIO4ALL or native ASIO driver.
cpal = "0.15"
dasp = "0.11"
rubato = "0.16"

# Networking
socket2 = "0.5"
mdns-sd = "0.12"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Static file embedding
rust-embed = "8.5"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
hostname = "0.4"
flume = "0.11"
futures-util = "0.3"
rand = "0.9"
base64 = "0.22"
urlencoding = "2.1"

# WebSocket client (for testing)
tokio-tungstenite = "0.26"
bytes = "1.9"

# System tray (Windows-only in service)
tray-icon = "0.21"
muda = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winit = "0.30"
winrt-notification = "0.5"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Testing
proptest = "1.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
